# Training Configuration

# General
seed: 42
device: "cuda"
num_workers: 4
pin_memory: true

# Optimization
optimizer:
  name: "adamw"
  lr: 1.0e-4
  weight_decay: 0.01
  betas: [0.9, 0.999]

scheduler:
  name: "cosine"
  T_max: 100
  eta_min: 1.0e-6
  warmup_epochs: 5

# Training
training:
  epochs: 100
  batch_size: 32
  gradient_clip: 1.0
  early_stopping:
    patience: 15
    min_delta: 0.001
    mode: "min"

# Loss
loss:
  name: "mse"
  # Auxiliary losses (optional)
  aux_losses:
    - name: "mae"
      weight: 0.1

# Validation
validation:
  interval: 1  # epochs
  metrics:
    - "rmse"
    - "mae"
    - "r2"
    - "mape"

# Checkpointing
checkpointing:
  save_dir: "checkpoints"
  save_top_k: 3
  monitor: "val_rmse"
  mode: "min"

# Logging
logging:
  project: "wheat-yield-prediction"
  entity: null  # wandb entity
  log_every_n_steps: 10
  save_artifacts: true
