name: DualChannelTransformerGATV2

# Target parameter range: [2.8M, 3.2M]
weather_input_dim: 15
sat_input_dim: 14

# Temporal transformer branch settings
weather_d_model: 160
sat_d_model: 160
weather_heads: 8
sat_heads: 8
weather_layers: 3
sat_layers: 3
weather_d_ff: 640
sat_d_ff: 640

dropout: 0.2
max_seq_len_weather: 64
max_seq_len_sat: 64

# Fusion and spatial graph blocks
fusion_hidden: 256
gat_hidden: 192
gat_heads: 4
gat_layers: 2

# Shared mode conditioning
opdate_embedding_dim: 16
fusion_mode: concat_gate
