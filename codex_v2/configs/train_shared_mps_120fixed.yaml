mode: shared
target_mode: district_signed_log

optimization:
  loss: huber
  lr: 3.0e-4
  weight_decay: 1.0e-2
  grad_clip: 1.0
  scheduler: cosine_warmup
  warmup_pct: 0.10

training:
  epochs: 120
  patience: 120
  batch_size: 16
  log_every: 1

runtime:
  device: mps
  deterministic: true
  save_predictions: true
