    yields: "/Users/aaryan/Downloads/ugp/data/yields"
    boundaries: "/Users/aaryan/Downloads/ugp/data/boundaries"
  processed: "/Users/aaryan/Downloads/ugp/expansion_2010_workspace/data/processed"

boundaries:
