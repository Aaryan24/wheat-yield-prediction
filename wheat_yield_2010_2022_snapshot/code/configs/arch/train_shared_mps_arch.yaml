mode: shared
target_mode: district_signed_log

optimization:
  loss: huber
  lr: 3.0e-4
  weight_decay: 1.0e-2
  grad_clip: 1.0
  scheduler: cosine_warmup
  warmup_pct: 0.10
  huber_delta: 1.0

training:
  epochs: 120
  patience: 120
  batch_size: 8
  log_every: 1
  use_weighted_sampler: false
  sample_pos_weight: 2.0
  checkpoint_objective: rmse
  min_drop_recall: 0.777
  neutral_weight: 0.35
  class_loss_weight: 1.0
  magnitude_loss_weight: 1.0
  magnitude_huber_delta: 0.5
  neutral_quantile: 0.10
  neutral_floor: 25.0
  neutral_cap: 125.0

runtime:
  device: mps
  deterministic: true
  save_predictions: true
